services:
  db:
    image: postgres:16-alpine
    container_name: unicen_siia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: unicen
    ports:
      - "5432:5432"
    volumes:
      - unicen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unicen"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unicen_siia_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:123456@db:5432/unicen
      PORT: 3000
      PASETO_SECRET_SEED: unicen_siia_2026_bolivia_paseto_v4_secret_seed_key_32b
      NODE_ENV: production
    ports:
      - "3000:3000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unicen_siia_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
      - "8080:80"

volumes:
  unicen_pgdata:
